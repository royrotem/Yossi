version: "3.8"

services:
  backend:
    build: ./backend
    container_name: dept-graph-backend
    ports:
      - "8500:8000"
    volumes:
      - db-data:/app
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: dept-graph-frontend
    ports:
      - "4200:4200"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  db-data:
